aid: enko-chem
name: Enko Chem
description: 'Enko Chem, Inc. (Enko) is an agricultural life sciences company founded
  in 2017 and headquartered in Mystic, Connecticut, where it operates an 89,000 sq
  ft research lab and greenhouse campus. Enko discovers and develops next-generation
  crop protection chemistry — weed, disease, insect and soil-pest control — using its
  proprietary ENKOMPASS platform, which combines DNA-encoded library screening, structure-based
  design, artificial intelligence and machine learning to identify new modes of action
  and lead molecules faster and at lower cost than conventional agrochemical R&D. Enko
  works through partnerships with Syngenta, Bayer, Nufarm and the Gates Foundation
  Strategic Investment Fund rather than selling software, and publishes no public API,
  developer portal, SDK or machine-readable specification.'
